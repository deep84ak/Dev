<!doctype html>
<html>
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Zeuz Live</title>
<style>
:root{--bg:#07111c;--p:#0d1a27;--line:#20384e;--txt:#edf6ff;--mut:#91a7b9;--g:#35d39b;--r:#ff6277;--y:#f5c451}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(#07111c,#0a1928);color:var(--txt);font-family:system-ui}
.app{max-width:1050px;margin:auto;padding:13px}.top{display:flex;justify-content:space-between;align-items:center}.brand{font-size:21px;font-weight:800}.sub{font-size:11px;color:var(--mut)}
.status{font-size:11px;border:1px solid var(--line);padding:7px 10px;border-radius:20px;background:#112435}
.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin:11px 0}.m,.card{background:var(--p);border:1px solid var(--line);border-radius:13px;padding:10px}
.m small{display:block;color:var(--mut);font-size:10px}.m b{font-size:17px}
.grid{display:grid;grid-template-columns:1.55fr .75fr;gap:10px}canvas{width:100%;height:390px;background:#07131e;border-radius:10px}
.controls{display:flex;gap:7px;flex-wrap:wrap;margin-top:8px}select,button{background:#13283a;color:white;border:1px solid #2b4961;border-radius:9px;padding:10px}
.signal{text-align:center;border:1px solid var(--line);border-radius:12px;padding:15px;background:#091622}.big{font-size:38px;font-weight:900}
.call .big{color:var(--g)}.put .big{color:var(--r)}.wait .big{color:var(--y)}
.row{display:flex;justify-content:space-between;border-bottom:1px solid #192d40;padding:9px 0;font-size:13px}.note{font-size:12px;color:var(--mut);line-height:1.45}.quality{margin-top:8px;padding:8px;border-radius:8px;background:#25200f;color:#f5d77d;font-size:12px}
@media(max-width:760px){.grid{grid-template-columns:1fr}.metrics{grid-template-columns:repeat(2,1fr)}canvas{height:330px}}
</style>
</head>
<body><div class="app">
<div class="top"><div><div class="brand">⚡ Zeuz Live</div><div class="sub">Live forex · FVG Fill · Trend Pullback</div></div><div class="status" id="status">CONNECTING</div></div>
<div class="metrics">
<div class="m"><small>PAIR</small><b id="pairName">EUR/USD</b></div>
<div class="m"><small>TIMEFRAME</small><b>1m</b></div>
<div class="m"><small>PRICE</small><b id="price">—</b></div>
<div class="m"><small>REFRESH</small><b id="timer">15s</b></div>
</div>
<div class="grid">
<div class="card">
<canvas id="cv" width="900" height="390"></canvas>
<div class="controls">
<select id="pair">
<option>EURUSD</option><option>GBPUSD</option><option>EURGBP</option><option>AUDUSD</option>
<option>USDJPY</option><option>GBPJPY</option><option>AUDJPY</option><option>NZDUSD</option>
</select>
<button id="refresh">Refresh</button><button id="pause">Pause</button>
</div>
<div class="quality" id="quality">Checking feed…</div>
</div>
<div class="card">
<div id="box" class="signal wait"><div class="sub">CURRENT SIGNAL</div><div class="big" id="sig">WAIT</div><div><span id="conf">0</span>% confidence</div></div>
<div class="row"><span>Setup</span><b id="setup">—</b></div>
<div class="row"><span>Trend</span><b id="trend">—</b></div>
<div class="row"><span>RSI 7</span><b id="rsi">—</b></div>
<div class="row"><span>FVG</span><b id="fvg">—</b></div>
<div class="row"><span>Last candle</span><b id="lastTime">—</b></div>
<p class="note" id="why">Waiting for valid data.</p>
<p class="note">Testing tool only. Verify signals before risking money.</p>
</div></div></div>
<script>
const $=id=>document.getElementById(id), cv=$("cv"), ctx=cv.getContext("2d");
let candles=[], running=true, seconds=15, pair="EURUSD";
const names={EURUSD:"EUR/USD",GBPUSD:"GBP/USD",EURGBP:"EUR/GBP",AUDUSD:"AUD/USD",USDJPY:"USD/JPY",GBPJPY:"GBP/JPY",AUDJPY:"AUD/JPY",NZDUSD:"NZD/USD"};
function ema(a,p){let k=2/(p+1),e=a[0];return a.map(v=>e=v*k+e*(1-k))}
function rsi(a,p=7){if(a.length<=p)return 50;let g=0,l=0;for(let i=a.length-p;i<a.length;i++){let d=a[i]-a[i-1];d>=0?g+=d:l-=d}return l===0?100:100-100/(1+(g/p)/(l/p))}
function detectFVG(a){if(a.length<3)return"None";let A=a.at(-3),C=a.at(-1);if(C.l>A.h)return"Bullish";if(C.h<A.l)return"Bearish";return"None"}
function quality(a){if(a.length<60)return[false,"Not enough candles"];let age=(Date.now()-a.at(-1).t)/60000;if(age>8)return[false,`Stale feed: ${Math.round(age)} min old`];let rr=a.slice(-40).map(x=>x.h-x.l).sort((x,y)=>x-y),m=rr[Math.floor(rr.length/2)]||0,bad=a.slice(-40).filter(x=>x.h-x.l>m*8).length;if(bad>=3)return[false,"Abnormal candle spikes detected"];return[true,"Feed quality passed"]}
function draw(){
ctx.clearRect(0,0,cv.width,cv.height);if(candles.length<10)return;
let a=candles.slice(-90),vals=a.flatMap(x=>[x.h,x.l]),mn=Math.min(...vals),mx=Math.max(...vals),pad=(mx-mn)*.08||1;
let y=v=>cv.height-20-(v-(mn-pad))/(mx-mn+2*pad)*(cv.height-40),cw=cv.width/a.length;
ctx.strokeStyle="#173047";for(let i=1;i<6;i++){let yy=i*cv.height/6;ctx.beginPath();ctx.moveTo(0,yy);ctx.lineTo(cv.width,yy);ctx.stroke()}
a.forEach((c,i)=>{let x=i*cw+cw/2,col=c.c>=c.o?"#35d39b":"#ff6277";ctx.strokeStyle=col;ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(x,y(c.h));ctx.lineTo(x,y(c.l));ctx.stroke();ctx.lineWidth=Math.max(2,cw*.58);ctx.beginPath();ctx.moveTo(x,y(c.o));ctx.lineTo(x,y(c.c));ctx.stroke()})
let cl=a.map(x=>x.c);[[ema(cl,50),"#43a5ff"],[ema(cl,200),"#d8a944"]].forEach(([e,col])=>{ctx.strokeStyle=col;ctx.lineWidth=2;ctx.beginPath();e.forEach((v,i)=>i?ctx.lineTo(i*cw+cw/2,y(v)):ctx.moveTo(cw/2,y(v)));ctx.stroke()})
}
function analyse(){
let cl=candles.map(x=>x.c),e20=ema(cl,20).at(-1),e50=ema(cl,50).at(-1),e200=ema(cl,200).at(-1),rv=rsi(cl),fv=detectFVG(candles),q=quality(candles);
let bull=0,bear=0,reasons=[],setup="WAIT";
if(e50>e200){bull+=2;reasons.push("Main trend bullish")}else{bear+=2;reasons.push("Main trend bearish")}
let last=cl.at(-1);
if(e50>e200 && last<=e20*1.0004 && last>=e50*.999){bull+=2;setup="TREND_PULLBACK";reasons.push("Bullish pullback zone")}
if(e50<e200 && last>=e20*.9996 && last<=e50*1.001){bear+=2;setup="TREND_PULLBACK";reasons.push("Bearish pullback zone")}
if(fv==="Bullish"){bull+=2;setup="FVG_FILL";reasons.push("Bullish FVG detected")}
if(fv==="Bearish"){bear+=2;setup="FVG_FILL";reasons.push("Bearish FVG detected")}
if(rv>52&&rv<72){bull++;reasons.push("RSI bullish")}else if(rv<48&&rv>28){bear++;reasons.push("RSI bearish")}
let s="WAIT",cf=0;if(q[0]&&Math.abs(bull-bear)>=3){s=bull>bear?"CALL":"PUT";cf=Math.min(82,58+Math.abs(bull-bear)*5)}
if(!q[0])reasons.unshift(q[1]);
$("box").className="signal "+s.toLowerCase();$("sig").textContent=s;$("conf").textContent=cf;$("setup").textContent=s==="WAIT"?"WAIT":setup;
$("trend").textContent=e50>e200?"Bullish":"Bearish";$("rsi").textContent=rv.toFixed(1);$("fvg").textContent=fv;$("quality").textContent=q[1];$("why").textContent=reasons.join(" · ");
}
async function load(){
try{$("status").textContent="CONNECTING";let r=await fetch(`/api/market?pair=${pair}&x=${Date.now()}`,{cache:"no-store"}),j=await r.json();if(!r.ok)throw Error(j.error||"Feed failed");
candles=j.candles;$("status").textContent="REAL MARKET FEED";$("pairName").textContent=names[pair];let c=candles.at(-1);$("price").textContent=c.c.toFixed(pair.includes("JPY")?3:5);$("lastTime").textContent=new Date(c.t).toLocaleTimeString([], {hour:"2-digit",minute:"2-digit"});seconds=15;draw();analyse()
}catch(e){$("status").textContent="FEED OFFLINE";$("quality").textContent=e.message;$("sig").textContent="WAIT";$("conf").textContent="0"}}
$("pair").onchange=e=>{pair=e.target.value;load()};$("refresh").onclick=load;$("pause").onclick=()=>{running=!running;$("pause").textContent=running?"Pause":"Resume"};
setInterval(()=>{if(!running)return;seconds--;if(seconds<=0)load();$("timer").textContent=Math.max(seconds,0)+"s"},1000);load();
</script></body></html>
